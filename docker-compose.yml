name: user-control

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_control
      MYSQL_USER: user_control
      MYSQL_PASSWORD: user_control
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: user_control
      DB_PASSWORD: user_control
      DB_NAME: user_control
      CORS_ORIGIN: http://localhost:3001
      SEED_USERS: 25
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./Frontend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: on-failure

volumes:
  mysql_data:
